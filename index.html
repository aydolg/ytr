<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Elite Portföy Terminali v3</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #030508; --card-bg: rgba(16, 20, 29, 0.9);
      --accent: #00ff9d; --red: #ff3b5c; --text: #ffffff;
      --text-muted: #94a3b8; --border: rgba(255, 255, 255, 0.1);
    }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 12px; }
    .container { max-width: 1200px; margin: 0 auto; }

    /* PERFORMANS PANELİ */
    .perf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .perf-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px; font-size: 0.7rem; }
    .perf-box.best { border-left: 3px solid var(--accent); }
    .perf-box.worst { border-left: 3px solid var(--red); }
    .perf-label { font-size: 0.55rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }

    /* AKAN YAZI (HIZLI VE KESİNTİSİZ) */
    .ticker-wrap { width: 100%; overflow: hidden; background: rgba(16, 20, 29, 0.5); border-radius: 10px; border: 1px solid var(--border); padding: 12px 0; margin-bottom: 15px; white-space: nowrap; }
    .ticker { display: inline-flex; animation: ticker-move 30s linear infinite; }
    .ticker-item { padding: 0 40px; font-size: 0.75rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    @keyframes ticker-move { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .ticker:hover { animation-play-state: paused; }

    /* ANA KARTLAR VE Z-INDEX ÇÖZÜMÜ */
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; position: relative; }
    @media (max-width: 600px) { .summary-grid { grid-template-columns: repeat(2, 1fr); } }
    .card { background: var(--card-bg); backdrop-filter: blur(15px); padding: 15px 12px; border-radius: 18px; border: 1px solid var(--border); cursor: pointer; position: relative; border-left: 4px solid #334155; transition: 0.2s; z-index: 1; }
    .card.active { border-color: var(--accent); z-index: 999 !important; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
    .card span { color: var(--text-muted); font-size: 0.6rem; font-weight: 700; text-transform: uppercase; display: block; margin-bottom: 4px; }
    .card .value { font-size: 0.95rem; font-weight: 800; }
    .card.up-card { border-left-color: var(--accent); }
    .card.down-card { border-left-color: var(--red); }

    /* KART TÜRLER LİSTESİ */
    .dist-container { display: none; background: #161b22; border: 1px solid var(--border); border-radius: 14px; padding: 10px; margin-top: 10px; position: absolute; left: 0; right: 0; top: 100%; z-index: 1000; width: 100%; box-sizing: border-box; }
    .card.active .dist-container { display: block; }
    .dist-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.75rem; font-weight: 600; }

    /* GRAFİK VE MARKET BLOĞU */
    .chart-block { background: var(--card-bg); border-radius: 20px; border: 1px solid var(--border); padding: 20px; margin-bottom: 15px; }
    .market-block { background: var(--card-bg); border-radius: 20px; border: 1px solid var(--border); padding: 5px 15px; margin-bottom: 25px; }
    .market-header { padding: 12px 0 8px 0; font-size: 0.65rem; font-weight: 800; color: var(--accent); letter-spacing: 1px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
    .m-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .m-name { font-size: 0.75rem; font-weight: 700; }
    .m-price { font-size: 0.9rem; font-weight: 800; font-family: monospace; }

    /* ASSET DETAY */
    .asset-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 8px; }
    .asset-main { padding: 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .asset-expand { display: none; padding: 15px; grid-template-columns: 1fr 1fr; gap: 12px; border-top: 1px solid var(--border); background: rgba(0,0,0,0.3); }
    .det-box { display: flex; flex-direction: column; }
    .det-lbl { font-size: 0.55rem; color: var(--text-muted); text-transform: uppercase; }
    .det-val { font-size: 0.8rem; font-weight: 700; }
    
    .up { color: var(--accent); } .down { color: var(--red); }
  </style>
</head>
<body>

<div class="container">
  <div class="perf-grid">
    <div id="bestPerf" class="perf-box best"><div class="perf-label">Günün Yıldızı</div><div class="up">...</div></div>
    <div id="worstPerf" class="perf-box worst"><div class="perf-label">Günün Zayıfı</div><div class="down">...</div></div>
  </div>

  <div class="summary-grid" id="summaryGrid"></div>
  
  <div class="ticker-wrap"><div class="ticker" id="tickerContent">Veriler senkronize ediliyor...</div></div>

  <div class="chart-block">
    <div class="market-header">PORTFÖY DAĞILIMI (%)</div>
    <div style="height: 220px;"><canvas id="allocationChart"></canvas></div>
  </div>

  <div class="market-block">
    <div class="market-header">GÜNCEL FİYATLAR</div>
    <div id="marketRows"></div>
  </div>

  <div id="detailSection" style="display:none; padding-bottom:100px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <div id="detailTitle" style="font-weight:800; color:var(--accent); font-size:0.8rem;">VARLIK ANALİZİ</div>
      <div onclick="closeAll()" style="color:var(--red); font-size:0.7rem; font-weight:bold; cursor:pointer;">[KAPAT X]</div>
    </div>
    <div id="assetGrid"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
  const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQeTFovlKfvEp9sPepJb9SGxf_2AgMU7eEPTDCc6WWc0o1Z1AizX6K2mJlaWtcvSderiBym7cyhEdsC/pub?gid=0&single=true&output=csv";
  let globalData = [];
  let allocationChart = null;

  function clean(v) {
    if (!v || v === "" || v.toString().includes('#N/A')) return 0;
    let num = v.toString().replace(/\./g, '').replace(',', '.').replace(/[^0-9.-]+/g, '');
    return parseFloat(num) || 0;
  }

  function fetchData() {
    Papa.parse(csvUrl, {
      download: true,
      complete: function(res) {
        globalData = res.data.slice(1).filter(r => r[0] && r[0] !== "Varlık").map(r => ({
          ad: r[0].trim(), tur: r[1], alisTarihi: r[2], adet: clean(r[4]),
          aFiyat: clean(r[5]), yatirim: clean(r[6]), fiyat: clean(r[7]), 
          tutar: clean(r[8]), gKZ: clean(r[9]), hKZ: clean(r[10]), aKZ: clean(r[11]), tKZ: clean(r[12])
        }));
        renderAll();
      }
    });
  }

  function renderAll() {
    const totals = { yatirim:0, tutar:0, tKZ:0, gKZ:0, hKZ:0, aKZ:0 };
    const groups = {};
    
    globalData.forEach(item => {
      if (!groups[item.tur]) groups[item.tur] = { yatirim:0, tutar:0, tKZ:0, gKZ:0, hKZ:0, aKZ:0 };
      Object.keys(totals).forEach(key => { groups[item.tur][key] += item[key]; totals[key] += item[key]; });
    });

    renderSummaries(totals, groups);
    renderTicker();
    renderMarketRows();
    renderPerformance();
    updateChart(groups);
  }

  function renderSummaries(totals, groups) {
    const keys = [{id:'yatirim', l:'Yatırım'}, {id:'tutar', l:'Portföy'}, {id:'tKZ', l:'Toplam K/Z'}, {id:'gKZ', l:'Günlük K/Z'}, {id:'hKZ', l:'Haftalık K/Z'}, {id:'aKZ', l:'Aylık K/Z'}];
    document.getElementById("summaryGrid").innerHTML = keys.map(k => {
      const val = totals[k.id], isKZ = k.id.includes('KZ');
      const cardStatus = isKZ ? (val >= 0 ? 'up-card' : 'down-card') : '';
      const color = isKZ ? (val >= 0 ? 'up' : 'down') : '';
      const sortedTur = Object.keys(groups).sort((a,b) => groups[b][k.id] - groups[a][k.id]);
      let distHtml = sortedTur.map(t => `<div class="dist-row" onclick="event.stopPropagation(); showDetails('${t}')"><span>${t}</span><span class="${groups[t][k.id]>=0?'up':'down'}">${groups[t][k.id].toLocaleString('tr-TR')} ₺</span></div>`).join('');
      return `<div class="card ${cardStatus}" onclick="toggleCard(this)"><span>${k.l}</span><div class="value ${color}">${val.toLocaleString('tr-TR')} ₺</div><div class="dist-container">${distHtml}</div></div>`;
    }).join('');
  }

  function renderPerformance() {
    const filtered = globalData.filter(d => d.tutar > 100);
    const sorted = [...filtered].sort((a, b) => {
        let aPerc = (a.gKZ / (a.tutar - a.gKZ)) || 0;
        let bPerc = (b.gKZ / (b.tutar - b.gKZ)) || 0;
        return bPerc - aPerc;
    });
    if(sorted.length > 0) {
        document.getElementById("bestPerf").querySelector('.up').innerText = sorted[0].ad;
        document.getElementById("worstPerf").querySelector('.down').innerText = sorted[sorted.length - 1].ad;
    }
  }

  function updateChart(groups) {
    const ctx = document.getElementById('allocationChart').getContext('2d');
    const labels = Object.keys(groups);
    const dataValues = labels.map(l => groups[l].tutar);
    if (allocationChart) allocationChart.destroy();
    allocationChart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: dataValues,
          backgroundColor: ['#00ff9d', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'],
          borderWidth: 2, borderColor: '#030508'
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'right', labels: { color: '#94a3b8', font: { size: 10 } } } }
      }
    });
  }

  function renderMarketRows() {
    const targetNames = ["USDTRY", "EURTRY", "ALTIN/USD", "ALTIN/TL", "GRAMALTIN", "ENFLASYON", "MEVDUAT"];
    const container = document.getElementById("marketRows");
    container.innerHTML = targetNames.map(name => {
      let v = globalData.find(d => d.ad.toUpperCase() === name.toUpperCase());
      if(!v) return ""; 
      return `<div class="m-row"><span class="m-name">${name}</span><span class="m-price ${v.gKZ >= 0 ? 'up' : 'down'}">${v.fiyat.toLocaleString('tr-TR')}</span></div>`;
    }).join('');
  }

  function renderTicker() {
    const ticker = document.getElementById("tickerContent");
    let moves = [];
    globalData.forEach(a => {
      if (a.tutar > 10) {
        let y = (a.gKZ / (a.tutar - a.gKZ)) * 100;
        moves.push(`<div class="ticker-item"><span>${a.ad}</span><span class="${y>=0?'up':'down'}">${y>=0?'▲':'▼'} %${Math.abs(y).toFixed(2)}</span></div>`);
      }
    });
    const content = moves.join('');
    ticker.innerHTML = content + content + content; // 3x Klonlama
    ticker.style.animationDuration = `${Math.max(moves.length * 3, 20)}s`;
  }

  function toggleCard(el) {
    const active = el.classList.contains('active');
    document.querySelectorAll('.card').forEach(c => { c.classList.remove('active'); c.style.zIndex = "1"; });
    if (!active) { el.classList.add('active'); el.style.zIndex = "999"; }
  }

  function showDetails(tur) {
    const sect = document.getElementById("detailSection"), grid = document.getElementById("assetGrid");
    sect.style.display = "block";
    grid.innerHTML = globalData.filter(d => d.tur === tur).sort((a,b) => b.tutar - a.tutar).map(a => `
      <div class="asset-item">
        <div class="asset-main" onclick="toggleAsset(this)">
          <div style="font-weight:700;">${a.ad}</div>
          <div style="text-align:right"><div class="up" style="font-weight:800;">${a.tutar.toLocaleString('tr-TR')} ₺</div><div class="${a.tKZ>=0?'up':'down'}" style="font-size:0.6rem;">${a.tKZ.toLocaleString('tr-TR')} ₺</div></div>
        </div>
        <div class="asset-expand">
          <div class="det-box"><span class="det-lbl">Adet</span><span class="det-val">${a.adet.toLocaleString('tr-TR')}</span></div>
          <div class="det-box"><span class="det-lbl">Alış Fiyatı</span><span class="det-val">${a.aFiyat.toLocaleString('tr-TR')}</span></div>
          <div class="det-box"><span class="det-lbl">Güncel Fiyat</span><span class="det-val up">${a.fiyat.toLocaleString('tr-TR')}</span></div>
          <div class="det-box"><span class="det-lbl">Günlük K/Z</span><span class="det-val ${a.gKZ>=0?'up':'down'}">${a.gKZ.toLocaleString('tr-TR')} ₺</span></div>
        </div>
      </div>`).join('');
    sect.scrollIntoView({ behavior: 'smooth' });
  }

  function toggleAsset(el) {
    const exp = el.parentElement.querySelector('.asset-expand');
    const open = exp.style.display === 'grid';
    document.querySelectorAll('.asset-expand').forEach(d => d.style.display = 'none');
    exp.style.display = open ? 'none' : 'grid';
  }

  function closeAll() {
    document.getElementById('detailSection').style.display = 'none';
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  }

  fetchData();
  setInterval(fetchData, 300000);
</script>
</body>
</html>
