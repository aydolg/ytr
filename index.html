<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Elite Portföy Terminali v3.2</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
:root {
  --bg:#030508;--card-bg:rgba(16,20,29,.95);
  --accent:#00ff9d;--red:#ff3b5c;
  --text:#fff;--muted:#94a3b8;
  --border:rgba(255,255,255,.1)
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);margin:0;padding:12px}
.container{max-width:1200px;margin:auto}
.up{color:var(--accent)} .down{color:var(--red)}
</style>
</head>

<body>
<div class="container">
  <div id="summaryGrid"></div>
  <div id="detailSection" style="display:none">
    <div id="assetGrid"></div>
  </div>
</div>

<script>
/* =========================
   NORMALIZATION LAYER
========================= */
function normalizeType(v){
  return (v ?? "")
    .toString()
    .replace(/\u00A0/g," ")
    .trim()
    .toLowerCase();
}

function clean(v){
  if(v===null||v===undefined) return 0;
  let s=v.toString().trim();
  if(s===""||s.includes("#N/A")) return 0;
  s=s.replace(/\u00A0/g,"")
     .replace(/\./g,"")
     .replace(",",".")
     .replace(/[^0-9.-]/g,"");
  const n=parseFloat(s);
  return isNaN(n)?0:n;
}

/* =========================
   DATA
========================= */
const csvUrl="https://docs.google.com/spreadsheets/d/e/2PACX-1vQeTFovlKfvEp9sPepJb9SGxf_2AgMU7eEPTDCc6WWc0o1Z1AizX6K2mJlaWtcvSderiBym7cyhEdsC/pub?gid=0&single=true&output=csv";
let globalData=[];

/* =========================
   FETCH
========================= */
function fetchData(){
Papa.parse(csvUrl,{
download:true,
complete:res=>{
globalData=res.data.slice(1)
.filter(r=>r[0]&&r[0]!=="Varlık")
.map(r=>({
  ad:r[0].trim(),
  tur:normalizeType(r[1]),
  alisTarihi:r[2],
  vade:r[3],
  adet:clean(r[4]),
  aFiyat:clean(r[5]),
  yatirim:clean(r[6]),
  fiyat:clean(r[7]),
  tutar:clean(r[8]),
  gKZ:clean(r[9]),
  hKZ:clean(r[10]),
  aKZ:clean(r[11]),
  tKZ:clean(r[12])
}));
renderAll();
}});
}

/* =========================
   RENDER
========================= */
function renderAll(){
const totals={yatirim:0,tutar:0,tKZ:0,gKZ:0,hKZ:0,aKZ:0};
const groups={};

globalData.forEach(i=>{
  const t=normalizeType(i.tur);
  if(!groups[t]){
    groups[t]={yatirim:0,tutar:0,tKZ:0,gKZ:0,hKZ:0,aKZ:0};
  }
  Object.keys(totals).forEach(k=>{
    groups[t][k]+=i[k];
    totals[k]+=i[k];
  });
});

document.getElementById("summaryGrid").innerHTML=
Object.keys(groups).map(t=>`
<div onclick="showDetails('${t}')"
     style="padding:12px;border:1px solid var(--border);
            margin-bottom:8px;border-radius:12px;cursor:pointer">
<b>${t.toUpperCase()}</b><br>
<span>${groups[t].tutar.toLocaleString('tr-TR')} ₺</span>
</div>`).join('');
}

/* =========================
   DETAILS
========================= */
function showDetails(tur){
const grid=document.getElementById("assetGrid");
document.getElementById("detailSection").style.display="block";

grid.innerHTML=globalData
.filter(d=>normalizeType(d.tur)===normalizeType(tur))
.sort((a,b)=>b.tutar-a.tutar)
.map(a=>`
<div style="border:1px solid var(--border);padding:10px;margin-bottom:6px;border-radius:10px">
<b>${a.ad}</b><br>
<span>${a.tutar.toLocaleString('tr-TR')} ₺</span>
</div>`).join('');
}

/* =========================
   INIT
========================= */
fetchData();
setInterval(fetchData,300000);
</script>
</body>
</html>
