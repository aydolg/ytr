<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Elite Portföy Terminali v5.2</title>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    :root{
      --bg: #0a0b0f; --bg2: #0d0f16;
      --card-bg: rgba(17, 18, 26, 0.38); --card-bg-strong: rgba(20, 22, 30, 0.58);
      --border: rgba(255,255,255,0.08); --text: #eef2f6; --text-muted: #9aa5b1;
      --magma-1: #ff3b2f; --magma-2: #ff7a1a; --magma-3: #ffa24c;
      --glow: rgba(255, 82, 35, 0.35); --glow-strong: rgba(255, 82, 35, 0.6);
      --up: #17f1a7; --down: #ff4d6d;
    }
    body{
      font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text); margin:0; padding:12px;
      background: radial-gradient(1200px 600px at 80% 0%, rgba(255, 94, 31, 0.18), transparent 60%),
        radial-gradient(900px 600px at -10% 30%, rgba(255, 0, 43, 0.15), transparent 60%),
        linear-gradient(180deg, var(--bg), var(--bg2)); line-height:1.45;
    }
    .container{ max-width:1200px; margin:0 auto; }
    .glass{
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02)), var(--card-bg);
      border: 1px solid var(--border); border-radius: 16px;
      box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 10px 40px rgba(0,0,0,0.35);
      backdrop-filter: blur(14px); transition: all .25s ease;
    }
    
    .status-badge{
      position: fixed; top: 10px; right: 10px; padding: 6px 12px; border-radius: 20px;
      font-size: .65rem; font-weight: 800; z-index: 9999; text-transform: uppercase;
      background: rgba(0,0,0,0.6); border: 1px solid var(--border);
    }
    .status-ok{ color: var(--up); border-color: var(--up); }
    .status-warn{ color: var(--magma-2); border-color: var(--magma-2); }
    .status-err{ color: var(--down); border-color: var(--down); }

    .perf-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:14px; }
    .perf-box{ padding:10px 12px; }
    .perf-label{ font-size:.58rem; color:var(--text-muted); font-weight:800; text-transform:uppercase; margin-bottom:2px; letter-spacing:.4px; }
    .perf-value{ display:flex; align-items:center; gap:8px; font-size:.82rem; font-weight:800; }

    .ticker-wrap{ width:100%; overflow:hidden; border-radius:12px; margin-bottom:14px; position:relative; border:1px solid var(--border); }
    .ticker-neon{ position:absolute; top:0; left:0; right:0; height:2px; background: linear-gradient(90deg, transparent, var(--magma-2), var(--magma-1), transparent); box-shadow: 0 0 12px var(--glow-strong); }
    .ticker{ display:inline-flex; align-items:center; white-space:nowrap; padding: 12px 0; animation: ticker-move 35s linear infinite; }
    .ticker-item{ padding: 0 36px; font-size:.75rem; font-weight:700; display:flex; align-items:center; gap:6px; }
    @keyframes ticker-move { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }

    .summary-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-bottom:16px; }
    @media (max-width: 680px){ .summary-grid{ grid-template-columns: repeat(2, 1fr); } }
    .card{ 
      padding:12px 10px; border-radius:16px; cursor:pointer; position:relative; z-index:1; 
      border-left: 4px solid rgba(255,255,255,0.05); 
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.025)), var(--card-bg-strong); 
      box-shadow: 0 10px 36px rgba(0,0,0,0.4), 0 0 16px rgba(255,82,35,0.18);
      min-height: 60px;
    }
    .card.active{ z-index: 999; box-shadow: 0 10px 50px rgba(0,0,0,0.55), 0 0 26px var(--glow-strong); }
    .card span{ color:var(--text-muted); font-size:.6rem; font-weight:800; text-transform:uppercase; display:block; margin-bottom:3px; letter-spacing:.3px; }
    .card .value{ font-size:.98rem; font-weight:900; letter-spacing:.2px; display:flex; align-items:baseline; gap:8px; flex-wrap: wrap; }
    .card.up-card{ border-left-color: var(--up); }
    .card.down-card{ border-left-color: var(--down); }
    .dist-container{ 
      display:none; position:absolute; left:0; right:0; top:100%; margin-top:8px; padding:10px; 
      z-index:1000; box-sizing:border-box; border-radius:14px; border:1px solid var(--border); 
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015)), #11131a; 
      box-shadow: 0 16px 36px rgba(0,0,0,0.45);
      max-height: 300px;
      overflow-y: auto;
    }
    .card.active .dist-container{ display:block; }
    .dist-row{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:.74rem; font-weight:700; }
    .dist-row:last-child{ border-bottom:0; }

    .sepet-block{ padding:8px 14px 12px 14px; border-radius:18px; margin-bottom:22px; }
    .sepet-header{ display:flex; justify-content:space-between; align-items:center; padding:12px 0 8px 0; font-size:.66rem; font-weight:900; color:#ffd1ae; letter-spacing:1px; border-bottom: 1px solid var(--border); cursor:pointer; }
    .sepet-header::after{ content: '▼'; font-size:.6rem; transition: transform .3s ease; color: var(--magma-2); }
    .sepet-block.collapsed .sepet-header::after{ transform: rotate(-90deg); }
    .sepet-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; max-height: 1000px; overflow: hidden; transition: max-height .4s ease, opacity .3s ease; opacity: 1; }
    .sepet-block.collapsed .sepet-grid{ max-height: 0; opacity: 0; margin-top: 0; }
    @media (max-width: 680px){ .sepet-grid{ grid-template-columns: repeat(2, 1fr); } }
    .sepet-card{ padding:12px 10px; border-radius:16px; cursor:pointer; border-left:4px solid rgba(255,255,255,0.06); background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.025)), var(--card-bg-strong); box-shadow: 0 10px 36px rgba(0,0,0,0.35), 0 0 16px rgba(255,82,35,0.18); }
    .sepet-card.up-card{ border-left-color: var(--up); }
    .sepet-card.down-card{ border-left-color: var(--down); }
    .sepet-name{ font-size:.6rem; letter-spacing:.4px; color:#ffd1ae; font-weight:900; text-transform:uppercase; margin-bottom:4px; }
    .sepet-val{ font-size:.98rem; font-weight:900; display:flex; align-items:baseline; gap:8px; }
    .sepet-sub{ font-size:.68rem; color:var(--text-muted); margin-top:6px; }

    .market-block{ padding:8px 14px 12px 14px; border-radius:18px; margin-bottom:22px; }
    .market-header{ display:flex; justify-content:space-between; align-items:center; padding:12px 0 8px 0; font-size:.66rem; font-weight:900; color:#ffd1ae; letter-spacing:1px; border-bottom: 1px solid var(--border); cursor:pointer; }
    .market-header::after{ content: '▼'; font-size:.6rem; transition: transform .3s ease; color: var(--magma-2); }
    .market-block.collapsed .market-header::after{ transform: rotate(-90deg); }
    .market-content{ max-height: 1000px; overflow: hidden; transition: max-height .4s ease, opacity .3s ease; opacity: 1; }
    .market-block.collapsed .market-content{ max-height: 0; opacity: 0; }
    .m-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
    .m-row:last-child{ border-bottom:0; }

    .asset-item{ margin-bottom:10px; overflow:hidden; border-radius:14px; background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02)), var(--card-bg); border:1px solid var(--border); box-shadow: 0 10px 36px rgba(0,0,0,0.35); }
    .asset-main{ padding:12px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
    .asset-expand{ display:none; padding:12px; gap:10px; border-top:1px solid var(--border); background: linear-gradient(180deg, rgba(255,130,60,0.04), rgba(255,130,60,0.02)); grid-template-columns: repeat(2, 1fr); }
    @media (min-width: 680px){ .asset-expand{ grid-template-columns: repeat(4, 1fr); } }
    .det-box{ display:flex; flex-direction:column; background: rgba(255,255,255,0.03); padding:8px; border-radius:10px; border:1px solid rgba(255,255,255,0.04); }
    .det-lbl{ font-size:.52rem; color:var(--text-muted); text-transform:uppercase; font-weight:900; letter-spacing:.3px; }
    .det-val{ font-size:.74rem; font-weight:800; color:#f1f5f9; display:flex; align-items:center; gap:6px; }

    .pct{ font-weight:900; font-size:.72rem; white-space:nowrap; }
    .pct.up-grad{ background: linear-gradient(90deg, #17f1a7, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .pct.down-grad{ background: linear-gradient(90deg, #ff3b2f, #ff7a1a); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .up{ color: var(--up); } .down{ color: var(--down); }

    .sepet-summary{ display:grid; grid-template-columns: 1fr; gap:12px; margin: 0 0 12px 0; padding:12px; border-radius:14px; border:1px solid var(--border); background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.025)), var(--card-bg-strong); box-shadow: 0 10px 36px rgba(0,0,0,0.4); }
    .sepet-kpis{ display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-bottom: 12px; }
    @media (max-width: 680px){ .sepet-kpis{ grid-template-columns: repeat(2, 1fr); } }
    .kpi{ background: rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.04); border-radius:10px; padding:10px; }
    .kpi .lbl{ font-size:.54rem; color:var(--text-muted); font-weight:900; text-transform:uppercase; margin-bottom:4px; }
    .kpi .val{ font-size:.9rem; font-weight:900; display:flex; align-items:baseline; gap:8px; }
    
    .sepet-chart-container{ background: rgba(0,0,0,0.2); border-radius: 12px; padding: 15px; border: 1px solid var(--border); }
    .chart-title{ font-size:.7rem; font-weight:900; color:#ffd1ae; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .sepet-stats-row{ display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    @media (max-width: 680px){ .sepet-stats-row{ grid-template-columns: repeat(2, 1fr); } }
    .stat-mini{ text-align: center; }
    .stat-mini .lbl{ font-size: 0.55rem; color: var(--text-muted); text-transform: uppercase; }
    .stat-mini .val{ font-size: 0.8rem; font-weight: 800; }
    
    .last-update{ font-size: 0.6rem; color: var(--text-muted); text-align: center; margin-top: 20px; padding: 10px; opacity: 0.7; }
    
    /* DEBUG */
    .debug-box{
      position: fixed;
      bottom: 10px;
      left: 10px;
      right: 10px;
      background: rgba(0,0,0,0.95);
      border: 2px solid var(--magma-2);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.7rem;
      color: #fff;
      max-height: 150px;
      overflow-y: auto;
      z-index: 10000;
      display: none;
      font-family: monospace;
    }
    .debug-box.show{ display: block; }
    .debug-btn{
      position: fixed;
      bottom: 10px;
      left: 10px;
      background: var(--magma-2);
      color: #000;
      border: none;
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 0.65rem;
      font-weight: 800;
      cursor: pointer;
      z-index: 10001;
    }
  </style>
</head>
<body>

<div id="statusBadge" class="status-badge status-warn">Bağlanıyor...</div>
<button class="debug-btn" onclick="toggleDebug()">DEBUG</button>
<div id="debugBox" class="debug-box"></div>

<div class="container">

  <div class="perf-grid">
    <div class="perf-box glass">
      <div class="perf-label">Günün Yıldızı</div>
      <div class="perf-value"><span class="up" id="bestName">...</span><span class="pct up-grad" id="bestPct">...</span></div>
    </div>
    <div class="perf-box glass">
      <div class="perf-label">Günün Zayıfı</div>
      <div class="perf-value"><span class="down" id="worstName">...</span><span class="pct down-grad" id="worstPct">...</span></div>
    </div>
  </div>

  <div class="ticker-wrap glass">
    <div class="ticker-neon"></div>
    <div class="ticker" id="tickerContent">Yükleniyor...</div>
  </div>

  <div class="summary-grid" id="summaryGrid">
    <div class="card">Yükleniyor...</div>
  </div>

  <div class="sepet-block glass collapsed" id="sepetBlock">
    <div class="sepet-header" onclick="toggleSepetBlock()">SEPETLER</div>
    <div class="sepet-grid" id="sepetGrid"></div>
  </div>

  <div class="market-block glass collapsed" id="marketBlock">
    <div class="market-header" onclick="toggleMarketBlock()">PİYASALAR</div>
    <div class="market-content" id="marketContent">
      <div id="marketRows" style="padding: 10px 0;"></div>
    </div>
  </div>

  <div id="detailSection" style="display:none; padding-bottom:100px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; padding: 0 5px;">
      <div id="detailTitle" style="font-weight:900; color:#ffd1ae; font-size:.82rem;">ANALİZ</div>
      <div onclick="closeAll()" style="color:var(--down); font-size:.7rem; font-weight:bold; cursor:pointer;">[KAPAT]</div>
    </div>
    
    <div id="sepetSummaryWrap" class="sepet-summary" style="display:none;">
      <div class="sepet-kpis" id="sepetKpis"></div>
      <div class="sepet-chart-container">
        <div class="chart-title">📈 SEPET GELİŞİMİ</div>
        <div style="height:200px;"><canvas id="sepetChart"></canvas></div>
        <div class="sepet-stats-row" id="sepetStatsRow"></div>
      </div>
      <div id="sepetTopList" style="margin-top:12px;"></div>
    </div>
    
    <div id="assetGrid"></div>
  </div>
  
  <div class="last-update" id="lastUpdate">Son güncelleme: --</div>
</div>

<script>
  // ==========================================
  // CONFIG
  // ==========================================
  const SHEET_ID = "2PACX-1vQeTFovlKfvEp9sPepJb9SGxf_2AgMU7eEPTDCc6WWc0o1Z1AizX6K2mJlaWtcvSderiBym7cyhEdsC";
  const GID_PORTFOLIO = 0;
  const GID_PIYASALAR = 1068816976;
  
  let globalData = [];
  let marketData = [];
  let sepetChart = null;
  let debugActive = false;

  // ==========================================
  // DEBUG FONKSİYONLARI
  // ==========================================
  function toggleDebug() {
    debugActive = !debugActive;
    document.getElementById('debugBox').classList.toggle('show');
    if (debugActive) {
      updateDebug();
    }
  }

  function debug(msg) {
    if (!debugActive) return;
    const box = document.getElementById('debugBox');
    const line = document.createElement('div');
    line.textContent = new Date().toLocaleTimeString() + ' | ' + msg;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
    if (box.children.length > 50) box.removeChild(box.firstChild);
  }

  function updateDebug() {
    if (!debugActive) return;
    const box = document.getElementById('debugBox');
    box.innerHTML = '';
    debug('Global data count: ' + globalData.length);
    if (globalData.length > 0) {
      debug('Örnek: ' + globalData[0].ad + ' | Yatırım:' + globalData[0].yatirim + ' | Tutar:' + globalData[0].tutar);
      const totals = calculateTotals();
      debug('TOPLAM Yatırım: ' + totals.yatirim);
      debug('TOPLAM Tutar: ' + totals.tutar);
      debug('TOPLAM K/Z: ' + totals.tKZ);
    }
  }

  // ==========================================
  // YARDIMCI FONKSİYONLAR
  // ==========================================
  function clean(value) {
    if (!value || value === '' || value === '-') return 0;
    const str = value.toString().trim();
    
    // Binlik ayraç ve ondalık ayırma
    // Önce son virgül ve noktayı bul
    const lastComma = str.lastIndexOf(',');
    const lastDot = str.lastIndexOf('.');
    
    let numStr;
    if (lastComma > lastDot && lastComma !== -1) {
      // Türkçe format: 1.234,56 veya 1234,56
      numStr = str.replace(/\,/g, '').replace('.', ',');
    } else if (lastDot > lastComma && lastDot !== -1) {
      // İngilizce format: 1,234.56
      numStr = str.replace(/,/g, '');
    } else {
      // Sadece sayı veya binlik ayraç yok
      numStr = str.replace(/,/g, '.');
    }
    
    const result = parseFloat(numStr.replace(/[^0-9.-]/g, ''));
    return isNaN(result) ? 0 : result;
  }

  function fmt(num) {
    return num.toLocaleString('tr-TR', {minimumFractionDigits: 0, maximumFractionDigits: 0});
  }

  function fmtPct(p) {
    if (!isFinite(p) || isNaN(p)) return "%0.00";
    const sign = p > 0 ? "+" : (p < 0 ? "−" : "");
    return sign + "%" + Math.abs(p).toFixed(2);
  }

  function pctClass(p) {
    return p >= 0 ? 'pct up-grad' : 'pct down-grad';
  }

  function kzClass(v) {
    return v >= 0 ? 'up' : 'down';
  }

  function calculateTotals() {
    const t = { yatirim: 0, tutar: 0, tKZ: 0, gKZ: 0, hKZ: 0, aKZ: 0 };
    for (let item of globalData) {
      t.yatirim += item.yatirim;
      t.tutar += item.tutar;
      t.tKZ += item.tKZ;
      t.gKZ += item.gKZ;
      t.hKZ += item.hKZ;
      t.aKZ += item.aKZ;
    }
    return t;
  }

  function getDaysBetween(dateStr) {
    if (!dateStr) return "-";
    try {
      const parts = dateStr.split(/[.\-/]/);
      if (parts.length !== 3) return "-";
      let d, m, y;
      if (dateStr.includes('-') && parts[0].length === 4) {
        [y, m, d] = parts;
      } else {
        [d, m, y] = parts;
      }
      if (y.length === 2) y = '20' + y;
      const date = new Date(parseInt(y), parseInt(m)-1, parseInt(d));
      const diff = Math.floor((new Date() - date) / (1000 * 60 * 60 * 24));
      return diff + " Gün";
    } catch(e) { return "-"; }
  }

  // ==========================================
  // VERİ ÇEKME
  // ==========================================
  function fetchData() {
    debug('Veri çekme başladı...');
    setStatus('Yükleniyor...', 'warn');
    
    const url = `https://docs.google.com/spreadsheets/d/e/${SHEET_ID}/pub?gid=${GID_PORTFOLIO}&single=true&output=csv`;
    debug('URL: ' + url.substring(0, 80) + '...');
    
    Papa.parse(url, {
      download: true,
      complete: function(results) {
        debug('CSV yüklendi, satır: ' + results.data.length);
        
        if (!results.data || results.data.length < 2) {
          setStatus('Veri yok', 'err');
          return;
        }
        
        // Header'ı atla (ilk satır)
        const rows = results.data.slice(1);
        globalData = [];
        
        for (let i = 0; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0] || r[0].trim() === '' || r[0] === 'Varlık') continue;
          
          const item = {
            ad: r[0]?.trim() || '',
            tur: r[1]?.trim() || '',
            alisTarihi: r[2] || '',
            adet: clean(r[4]),
            aFiyat: clean(r[5]),
            yatirim: clean(r[6]),
            fiyat: clean(r[7]),
            tutar: clean(r[8]),
            gKZ: clean(r[9]),
            hKZ: clean(r[10]),
            aKZ: clean(r[11]),
            tKZ: clean(r[15]) || (clean(r[8]) - clean(r[6])),
            sepet: r[18]?.trim() || "Genel Sepet"
          };
          
          // Hesaplanan alanlar
          if (item.tKZ === 0 && item.tutar > 0 && item.yatirim > 0) {
            item.tKZ = item.tutar - item.yatirim;
          }
          
          globalData.push(item);
          
          if (i < 3) {
            debug('Item ' + i + ': ' + item.ad + ' Yatırım=' + item.yatirim + ' Tutar=' + item.tutar);
          }
        }
        
        debug('İşlenen kayıt: ' + globalData.length);
        fetchMarketData();
      },
      error: function(err) {
        debug('HATA: ' + err);
        setStatus('Hata', 'err');
      }
    });
  }

  function fetchMarketData() {
    const url = `https://docs.google.com/spreadsheets/d/e/${SHEET_ID}/pub?gid=${GID_PIYASALAR}&single=true&output=csv`;
    
    Papa.parse(url, {
      download: true,
      complete: function(results) {
        marketData = results.data.slice(1)
          .filter(r => r[0] && r[0].trim() !== '')
          .map(r => ({
            ad: r[0].trim(),
            fiyat: clean(r[1]),
            degisim: clean(r[2])
          }));
        setStatus('Bağlandı', 'ok');
        renderAll();
        updateDebug();
      },
      error: function() {
        marketData = [];
        setStatus('Piyasa hatası', 'err');
        renderAll();
      }
    });
  }

  function setStatus(text, type) {
    const badge = document.getElementById('statusBadge');
    badge.textContent = text;
    badge.className = 'status-badge status-' + type;
  }

  // ==========================================
  // RENDER
  // ==========================================
  function renderAll() {
    debug('renderAll() başladı, kayıt: ' + globalData.length);
    
    if (globalData.length === 0) {
      document.getElementById('summaryGrid').innerHTML = '<div class="card" style="grid-column: span 3; text-align: center;">Veri yok</div>';
      return;
    }
    
    const totals = calculateTotals();
    debug('Totals: Yatırım=' + totals.yatirim + ' Tutar=' + totals.tutar + ' K/Z=' + totals.tKZ);
    
    // Gruplar
    const groups = {};
    const sepetGroups = {};
    
    for (let item of globalData) {
      // Tür grupları
      if (!groups[item.tur]) {
        groups[item.tur] = { yatirim: 0, tutar: 0, tKZ: 0, gKZ: 0, hKZ: 0, aKZ: 0, items: [] };
      }
      groups[item.tur].yatirim += item.yatirim;
      groups[item.tur].tutar += item.tutar;
      groups[item.tur].tKZ += item.tKZ;
      groups[item.tur].gKZ += item.gKZ;
      groups[item.tur].hKZ += item.hKZ;
      groups[item.tur].aKZ += item.aKZ;
      groups[item.tur].items.push(item);
      
      // Sepet grupları
      const s = item.sepet || "Genel Sepet";
      if (!sepetGroups[s]) {
        sepetGroups[s] = { yatirim: 0, tutar: 0, tKZ: 0, gKZ: 0, hKZ: 0, aKZ: 0, items: [] };
      }
      sepetGroups[s].yatirim += item.yatirim;
      sepetGroups[s].tutar += item.tutar;
      sepetGroups[s].tKZ += item.tKZ;
      sepetGroups[s].gKZ += item.gKZ;
      sepetGroups[s].hKZ += item.hKZ;
      sepetGroups[s].aKZ += item.aKZ;
      sepetGroups[s].items.push(item);
    }
    
    renderSummaries(totals, groups);
    renderSepetCards(sepetGroups);
    renderTicker();
    renderMarketRows();
    renderPerformance();
    
    document.getElementById('lastUpdate').textContent = 'Son güncelleme: ' + new Date().toLocaleString('tr-TR');
  }

  function renderSummaries(totals, groups) {
    const keys = [
      {id: 'yatirim', label: 'Yatırım', isMoney: true, isKZ: false},
      {id: 'tutar', label: 'Portföy', isMoney: true, isKZ: false},
      {id: 'tKZ', label: 'Toplam K/Z', isMoney: true, isKZ: true},
      {id: 'gKZ', label: 'Günlük K/Z', isMoney: true, isKZ: true},
      {id: 'hKZ', label: 'Haftalık K/Z', isMoney: true, isKZ: true},
      {id: 'aKZ', label: 'Aylık K/Z', isMoney: true, isKZ: true}
    ];
    
    let html = '';
    
    for (let k of keys) {
      const val = totals[k.id];
      let pct = null;
      
      // Yüzde hesaplama
      if (k.id === 'tKZ' || k.id === 'tutar') {
        pct = totals.yatirim > 0 ? (totals.tKZ / totals.yatirim) * 100 : 0;
      } else if (['gKZ', 'hKZ', 'aKZ'].includes(k.id)) {
        const base = totals.tutar - totals[k.id];
        pct = base > 0 ? (totals[k.id] / base) * 100 : 0;
      }
      
      const cardClass = k.isKZ ? (val >= 0 ? 'up-card' : 'down-card') : '';
      const valClass = k.isKZ ? (val >= 0 ? 'up' : 'down') : '';
      
      // Dağılım listesi
      let distHtml = '';
      const sortedGroups = Object.keys(groups).sort((a, b) => groups[b][k.id] - groups[a][k.id]);
      
      for (let g of sortedGroups) {
        const gv = groups[g][k.id];
        let gpct = null;
        if (k.id === 'tKZ' || k.id === 'tutar') {
          gpct = groups[g].yatirim > 0 ? (groups[g].tKZ / groups[g].yatirim) * 100 : 0;
        } else {
          const gbase = groups[g].tutar - gv;
          gpct = gbase > 0 ? (gv / gbase) * 100 : 0;
        }
        
        const gClass = k.isKZ ? kzClass(gv) : '';
        distHtml += `<div class="dist-row" onclick="event.stopPropagation(); showDetails('${g}')">
          <span>${g}</span>
          <span class="${gClass}">
            ${fmt(gv)}${k.isMoney ? ' ₺' : ''}
            ${gpct !== null ? `<span class="${pctClass(gpct)}">${fmtPct(gpct)}</span>` : ''}
          </span>
        </div>`;
      }
      
      html += `<div class="card ${cardClass}" onclick="toggleCard(this)">
        <span>${k.label}</span>
        <div class="value ${valClass}">
          ${fmt(val)}${k.isMoney ? ' ₺' : ''}
          ${pct !== null ? `<span class="${pctClass(pct)}">${fmtPct(pct)}</span>` : ''}
        </div>
        <div class="dist-container">${distHtml}</div>
      </div>`;
    }
    
    document.getElementById('summaryGrid').innerHTML = html;
    debug('Summaries render edildi');
  }

  function renderSepetCards(sepetGroups) {
    const sortedSepetler = Object.keys(sepetGroups).sort((a, b) => sepetGroups[b].tutar - sepetGroups[a].tutar);
    
    let html = '';
    for (let name of sortedSepetler) {
      const g = sepetGroups[name];
      const p = g.yatirim > 0 ? (g.tKZ / g.yatirim) * 100 : 0;
      const topItem = g.items.sort((a, b) => b.tutar - a.tutar)[0];
      const share = g.tutar > 0 && topItem ? (topItem.tutar / g.tutar) * 100 : 0;
      
      html += `<div class="sepet-card ${p >= 0 ? 'up-card' : 'down-card'}" onclick="showSepetDetails('${name.replace(/'/g, "\\'")}')">
        <div class="sepet-name">${name}</div>
        <div class="sepet-val ${g.tKZ >= 0 ? 'up' : 'down'}">
          ${fmt(g.tutar)} ₺<span class="${pctClass(p)}">${fmtPct(p)}</span>
        </div>
        <div class="sepet-sub">En büyük: ${topItem?.ad || '-'} (${share.toFixed(1)}%)</div>
      </div>`;
    }
    
    document.getElementById('sepetGrid').innerHTML = html;
  }

  function renderPerformance() {
    const sorted = [...globalData]
      .filter(d => d.tutar > 50)
      .sort((a, b) => {
        const pa = a.tutar - a.gKZ > 0 ? (a.gKZ / (a.tutar - a.gKZ)) * 100 : 0;
        const pb = b.tutar - b.gKZ > 0 ? (b.gKZ / (b.tutar - b.gKZ)) * 100 : 0;
        return pb - pa;
      });
    
    if (sorted.length > 0) {
      const best = sorted[0];
      const worst = sorted[sorted.length - 1];
      
      const bestPct = best.tutar - best.gKZ > 0 ? (best.gKZ / (best.tutar - best.gKZ)) * 100 : 0;
      const worstPct = worst.tutar - worst.gKZ > 0 ? (worst.gKZ / (worst.tutar - worst.gKZ)) * 100 : 0;
      
      document.getElementById('bestName').textContent = best.ad;
      document.getElementById('bestPct').textContent = fmtPct(bestPct);
      document.getElementById('bestPct').className = pctClass(bestPct);
      
      document.getElementById('worstName').textContent = worst.ad;
      document.getElementById('worstPct').textContent = fmtPct(worstPct);
      document.getElementById('worstPct').className = pctClass(worstPct);
    }
  }

  function renderMarketRows() {
    const container = document.getElementById('marketRows');
    if (!marketData || marketData.length === 0) {
      container.innerHTML = '<div class="m-row"><span style="color:var(--text-muted)">Veri yok</span></div>';
      return;
    }
    
    let html = '';
    for (let item of marketData) {
      const p = item.degisim || 0;
      html += `<div class="m-row">
        <span style="font-size:.75rem; font-weight:800;">${item.ad}</span>
        <span style="font-weight:900;">
          <span class="${p >= 0 ? 'up' : 'down'}">${fmt(item.fiyat)}</span>
          <span class="${pctClass(p)}">(${fmtPct(p)})</span>
        </span>
      </div>`;
    }
    container.innerHTML = html;
  }

  function renderTicker() {
    const items = [...globalData]
      .filter(a => a.tutar > 10)
      .sort((a, b) => Math.abs(b.gKZ) - Math.abs(a.gKZ))
      .slice(0, 15);
    
    let html = '';
    for (let item of items) {
      const p = item.tutar - item.gKZ > 0 ? (item.gKZ / (item.tutar - item.gKZ)) * 100 : 0;
      html += `<div class="ticker-item">
        <span>${item.ad}</span>
        <span class="${pctClass(p)}">${fmtPct(p)}</span>
      </div>`;
    }
    
    const ticker = document.getElementById('tickerContent');
    ticker.innerHTML = html || '<div class="ticker-item">Veri yok</div>';
    ticker.style.animationDuration = Math.max(items.length * 3, 20) + 's';
  }

  // ==========================================
  // DETAY GÖSTERİM
  // ==========================================
  function showDetails(tur) {
    document.getElementById('sepetSummaryWrap').style.display = 'none';
    document.getElementById('detailSection').style.display = 'block';
    document.getElementById('detailTitle').textContent = 'TÜR: ' + tur.toUpperCase();
    
    const items = globalData.filter(d => d.tur === tur).sort((a, b) => b.tutar - a.tutar);
    
    const tot = items.reduce((acc, x) => {
      acc.yatirim += x.yatirim;
      acc.tutar += x.tutar;
      acc.tKZ += x.tKZ;
      return acc;
    }, {yatirim: 0, tutar: 0, tKZ: 0});
    
    const p = tot.yatirim > 0 ? (tot.tKZ / tot.yatirim) * 100 : 0;
    
    document.getElementById('assetGrid').innerHTML = `
      <div style="background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--border);">
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; text-align: center; font-size: 0.75rem;">
          <div><div style="color: var(--text-muted); font-size: 0.6rem;">VARLIK</div><div style="font-weight: 800; color: #ffd1ae;">${items.length}</div></div>
          <div><div style="color: var(--text-muted); font-size: 0.6rem;">YATIRIM</div><div style="font-weight: 800;">${fmt(tot.yatirim)} ₺</div></div>
          <div><div style="color: var(--text-muted); font-size: 0.6rem;">GÜNCEL</div><div class="${kzClass(tot.tKZ)}" style="font-weight: 800;">${fmt(tot.tutar)} ₺</div></div>
          <div><div style="color: var(--text-muted); font-size: 0.6rem;">K/Z</div><div class="${kzClass(tot.tKZ)}" style="font-weight: 800;">${fmtPct(p)}</div></div>
        </div>
      </div>
      ${items.map(renderAssetItem).join('')}
    `;
    
    document.getElementById('detailSection').scrollIntoView({behavior: 'smooth'});
  }

  function showSepetDetails(sepetName) {
    document.getElementById('detailSection').style.display = 'block';
    document.getElementById('detailTitle').textContent = 'SEPET: ' + sepetName.toUpperCase();
    
    const items = globalData.filter(x => (x.sepet || "Genel Sepet") === sepetName);
    
    const tot = items.reduce((acc, x) => {
      acc.yatirim += x.yatirim;
      acc.tutar += x.tutar;
      acc.tKZ += x.tKZ;
      acc.gKZ += x.gKZ;
      acc.hKZ += x.hKZ;
      acc.aKZ += x.aKZ;
      return acc;
    }, {yatirim: 0, tutar: 0, tKZ: 0, gKZ: 0, hKZ: 0, aKZ: 0});
    
    const pTotal = tot.yatirim > 0 ? (tot.tKZ / tot.yatirim) * 100 : 0;
    const pG = tot.tutar - tot.gKZ > 0 ? (tot.gKZ / (tot.tutar - tot.gKZ)) * 100 : 0;
    const pH = tot.tutar - tot.hKZ > 0 ? (tot.hKZ / (tot.tutar - tot.hKZ)) * 100 : 0;
    const pA = tot.tutar - tot.aKZ > 0 ? (tot.aKZ / (tot.tutar - tot.aKZ)) * 100 : 0;
    
    // KPI'lar
    const kpi = (label, val, pct) => `
      <div class="kpi">
        <div class="lbl">${label}</div>
        <div class="val ${val >= 0 ? 'up' : 'down'}">
          ${fmt(val)} ₺${pct !== null ? `<span class="${pctClass(pct)}">${fmtPct(pct)}</span>` : ''}
        </div>
      </div>
    `;
    
    document.getElementById('sepetKpis').innerHTML = 
      kpi('Portföy', tot.tutar, pTotal) +
      kpi('Yatırım', tot.yatirim, null) +
      kpi('Toplam K/Z', tot.tKZ, pTotal) +
      kpi('Günlük', tot.gKZ, pG) +
      kpi('Haftalık', tot.hKZ, pH) +
      kpi('Aylık', tot.aKZ, pA);
    
    // Grafik
    renderSepetChart(items, tot);
    
    // İstatistikler
    const avgDays = items.length > 0 ? Math.round(items.reduce((acc, x) => {
      const d = parseInt(getDaysBetween(x.alisTarihi));
      return acc + (isNaN(d) ? 0 : d);
    }, 0) / items.length) : 0;
    
    const best = items.reduce((b, x) => x.tKZ > b.tKZ ? x : b, items[0]);
    const worst = items.reduce((w, x) => x.tKZ < w.tKZ ? x : w, items[0]);
    
    document.getElementById('sepetStatsRow').innerHTML = `
      <div class="stat-mini"><div class="lbl">Ort. Süre</div><div class="val" style="color: #ffd1ae;">${avgDays} Gün</div></div>
      <div class="stat-mini"><div class="lbl">En İyi</div><div class="val up">${best?.ad || '-'} ${best ? fmtPct(best.yatirim > 0 ? (best.tKZ / best.yatirim) * 100 : 0) : ''}</div></div>
      <div class="stat-mini"><div class="lbl">En Kötü</div><div class="val down">${worst?.ad || '-'} ${worst ? fmtPct(worst.yatirim > 0 ? (worst.tKZ / worst.yatirim) * 100 : 0) : ''}</div></div>
      <div class="stat-mini"><div class="lbl">Çeşitlilik</div><div class="val" style="color: #22d3ee;">${[...new Set(items.map(x => x.tur))].length} Tür</div></div>
    `;
    
    // Top 3
    const top3 = [...items].sort((a, b) => b.tutar - a.tutar).slice(0, 3);
    document.getElementById('sepetTopList').innerHTML = `
      <div style="font-size: .65rem; font-weight: 900; color: #ffd1ae; margin-bottom: 8px;">🎯 EN BÜYÜK 3 VARLIK</div>
      ${top3.map((v, i) => {
        const share = tot.tutar > 0 ? (v.tutar / tot.tutar) * 100 : 0;
        const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : '🥉';
        return `<div style="display:flex; justify-content:space-between; font-size:.72rem; padding:6px 0; border-bottom: 1px solid rgba(255,255,255,0.05);">
          <span>${medal} ${v.ad} <span style="color: var(--text-muted); font-size: 0.6rem;">(${v.tur})</span></span>
          <span style="font-weight: 800;">${share.toFixed(1)}% • ${fmt(v.tutar)} ₺</span>
        </div>`;
      }).join('')}
    `;
    
    document.getElementById('sepetSummaryWrap').style.display = 'block';
    document.getElementById('assetGrid').innerHTML = items.sort((a, b) => b.tutar - a.tutar).map(renderAssetItem).join('');
    document.getElementById('detailSection').scrollIntoView({behavior: 'smooth'});
  }

  function renderSepetChart(items, totals) {
    const ctx = document.getElementById('sepetChart').getContext('2d');
    
    if (sepetChart) {
      sepetChart.destroy();
      sepetChart = null;
    }
    
    // Tarihe göre sırala
    const sorted = [...items].sort((a, b) => {
      const da = a.alisTarihi ? new Date(a.alisTarihi.split('.').reverse().join('-')) : new Date(0);
      const db = b.alisTarihi ? new Date(b.alisTarihi.split('.').reverse().join('-')) : new Date(0);
      return da - db;
    });
    
    const labels = [];
    const yatirimData = [];
    const degerData = [];
    
    let cumYatirim = 0;
    let cumDeger = 0;
    
    for (let item of sorted) {
      cumYatirim += item.yatirim;
      cumDeger += item.tutar;
      labels.push(item.alisTarihi || '-');
      yatirimData.push(cumYatirim);
      degerData.push(cumDeger);
    }
    
    // Bugünü ekle
    if (labels[labels.length - 1] !== 'Bugün') {
      labels.push('Bugün');
      yatirimData.push(totals.yatirim);
      degerData.push(totals.tutar);
    }
    
    const grad1 = ctx.createLinearGradient(0, 0, 0, 200);
    grad1.addColorStop(0, 'rgba(23, 241, 167, 0.3)');
    grad1.addColorStop(1, 'rgba(23, 241, 167, 0)');
    
    const grad2 = ctx.createLinearGradient(0, 0, 0, 200);
    grad2.addColorStop(0, 'rgba(255, 122, 26, 0.4)');
    grad2.addColorStop(1, 'rgba(255, 122, 26, 0)');
    
    sepetChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            label: 'Yatırım',
            data: yatirimData,
            borderColor: '#17f1a7',
            backgroundColor: grad1,
            fill: true,
            tension: 0.4,
            pointRadius: 3
          },
          {
            label: 'Değer',
            data: degerData,
            borderColor: '#ff7a1a',
            backgroundColor: grad2,
            fill: true,
            tension: 0.4,
            pointRadius: 4,
            borderWidth: 3
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: 'rgba(0,0,0,0.9)',
            titleColor: '#ffd1ae',
            callbacks: {
              label: (ctx) => ctx.dataset.label + ': ' + fmt(ctx.parsed.y) + ' ₺'
            }
          }
        },
        scales: {
          x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#9aa5b1', font: { size: 10 } } },
          y: { 
            grid: { color: 'rgba(255,255,255,0.05)' }, 
            ticks: { 
              color: '#9aa5b1', 
              font: { size: 10 },
              callback: (v) => v >= 1000000 ? (v/1000000).toFixed(1) + 'M' : v >= 1000 ? (v/1000).toFixed(0) + 'K' : v
            } 
          }
        }
      }
    });
  }

  function renderAssetItem(a) {
    const pTotal = a.yatirim > 0 ? (a.tKZ / a.yatirim) * 100 : 0;
    const pG = a.tutar - a.gKZ > 0 ? (a.gKZ / (a.tutar - a.gKZ)) * 100 : 0;
    const pH = a.tutar - a.hKZ > 0 ? (a.hKZ / (a.tutar - a.hKZ)) * 100 : 0;
    const pA = a.tutar - a.aKZ > 0 ? (a.aKZ / (a.tutar - a.aKZ)) * 100 : 0;
    
    return `<div class="asset-item">
      <div class="asset-main" onclick="toggleAsset(this.parentElement.querySelector('.asset-expand'))">
        <div style="font-weight:800; font-size:.82rem;">
          <span style="color: ${a.tKZ >= 0 ? 'var(--up)' : 'var(--down)'}; font-size: 0.7rem; margin-right: 6px;">${a.tKZ >= 0 ? '▲' : '▼'}</span>
          ${a.ad}
        </div>
        <div style="text-align:right">
          <div class="${kzClass(a.tKZ)}" style="font-weight:900; font-size:.9rem;">
            ${fmt(a.tutar)} ₺<span class="${pctClass(pTotal)}">(${fmtPct(pTotal)})</span>
          </div>
          <div class="${kzClass(a.tKZ)}" style="font-size:.62rem; opacity: 0.8;">${fmt(a.tKZ)} ₺ K/Z</div>
        </div>
      </div>
      <div class="asset-expand">
        <div class="det-box"><span class="det-lbl">Güncel Fiyat</span><span class="det-val" style="color:#ffd1ae;">${fmt(a.fiyat)} ₺</span></div>
        <div class="det-box"><span class="det-lbl">Sepet</span><span class="det-val">${a.sepet}</span></div>
        <div class="det-box"><span class="det-lbl">Tür</span><span class="det-val">${a.tur || '-'}</span></div>
        <div class="det-box"><span class="det-lbl">Adet</span><span class="det-val">${fmt(a.adet)}</span></div>
        <div class="det-box"><span class="det-lbl">Alış Fiyatı</span><span class="det-val">${fmt(a.aFiyat)} ₺</span></div>
        <div class="det-box"><span class="det-lbl">Yatırım</span><span class="det-val">${fmt(a.yatirim)} ₺</span></div>
        <div class="det-box"><span class="det-lbl">Süre</span><span class="det-val">${getDaysBetween(a.alisTarihi)}</span></div>
        <div class="det-box"><span class="det-lbl">Günlük K/Z</span><span class="det-val ${kzClass(a.gKZ)}">${fmt(a.gKZ)} ₺<span class="${pctClass(pG)}">${fmtPct(pG)}</span></span></div>
        <div class="det-box"><span class="det-lbl">Haftalık K/Z</span><span class="det-val ${kzClass(a.hKZ)}">${fmt(a.hKZ)} ₺<span class="${pctClass(pH)}">${fmtPct(pH)}</span></span></div>
        <div class="det-box"><span class="det-lbl">Aylık K/Z</span><span class="det-val ${kzClass(a.aKZ)}">${fmt(a.aKZ)} ₺<span class="${pctClass(pA)}">${fmtPct(pA)}</span></span></div>
        <div class="det-box" style="grid-column: span 2; background: rgba(255,255,255,0.05);">
          <span class="det-lbl">Toplam K/Z</span>
          <span class="det-val ${kzClass(a.tKZ)}" style="font-size: 1rem;">${fmt(a.tKZ)} ₺<span class="${pctClass(pTotal)}">${fmtPct(pTotal)}</span></span>
        </div>
      </div>
    </div>`;
  }

  // ==========================================
  // UI FONKSİYONLARI
  // ==========================================
  function toggleCard(el) {
    const active = el.classList.contains('active');
    document.querySelectorAll('.card').forEach(c => {
      c.classList.remove('active');
      c.style.zIndex = '1';
    });
    if (!active) {
      el.classList.add('active');
      el.style.zIndex = '999';
    }
  }

  function toggleSepetBlock() {
    document.getElementById('sepetBlock').classList.toggle('collapsed');
  }

  function toggleMarketBlock() {
    document.getElementById('marketBlock').classList.toggle('collapsed');
  }

  function toggleAsset(el) {
    const isVisible = el.style.display === 'grid';
    document.querySelectorAll('.asset-expand').forEach(d => d.style.display = 'none');
    el.style.display = isVisible ? 'none' : 'grid';
  }

  function closeAll() {
    document.getElementById('detailSection').style.display = 'none';
    document.getElementById('sepetSummaryWrap').style.display = 'none';
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    if (sepetChart) {
      sepetChart.destroy();
      sepetChart = null;
    }
  }

  // ==========================================
  // BAŞLAT
  // ==========================================
  fetchData();
  setInterval(fetchData, 300000); // 5 dakika
</script>
</body>
</html>
